project:
  type: book

book:
  title: "Data-Driven Brand & Product Strategy"
  subtitle: "An R-based Analysis of YouTube and Google Trends"
  author: "**Daniel Huber & Dongyuan Gao**"
  date: "09/16/2025"
  chapters:
    - index.qmd
    - Chapters_Rbootcamp_Project/2_Prepare_the_Data_for_Analysis.qmd
    - Chapters_Rbootcamp_Project/3_Analysis_Visualisation.qmd
    - Chapters_Rbootcamp_Project/4_chapter_package_of_choice.qmd
    - Chapters_Rbootcamp_Project/5_Generative_AI.qmd
    - Chapters_Rbootcamp_Project/6_Conclusion_Limitation_Outlook.qmd
  output-file: "Data_Driven_Brand_Product_Strategy_Gao_Huber"

format:
  html:
    toc: true
    theme: flatly
    page-layout: full
    css: style.css
    fig-align: center
  pdf:
    toc: true
    number-sections: true
    documentclass: scrreprt   # KOMA-Script
    classoption: 10pt
    fig-align: center
    include-in-header:
      text: |
        \usepackage{tocloft}
        \renewcommand{\cfttoctitlefont}{\Large\bfseries}
        \setlength{\cftbeforetoctitleskip}{-10pt}
        \setlength{\cftaftertoctitleskip}{0pt}
        % Kapitelabstände anpassen
        \RedeclareSectionCommand[
          beforeskip=10pt,   % Abstand vor Kapitel (Standard ~50pt → jetzt viel kleiner)
          afterskip=10pt     % Abstand nach Kapitel (etwas kleiner als Standard ~20pt)
        ]{chapter}
    geometry: top=0.7cm, bottom=1.0cm, left=2cm, right=2cm
    mainfont: Arial

execute:
  echo: true
  warning: false
  message: false

